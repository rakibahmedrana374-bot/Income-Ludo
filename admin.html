<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ludo Master Admin v2</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7f5;color:#17201a}
button{border:0;border-radius:9px;padding:10px 13px;cursor:pointer;font-weight:700}
.btn,.primary{background:#16a34a;color:#fff}.btn:hover,.primary:hover{background:#15803d}
.btn-danger{background:#dc2626;color:#fff}.btn-gray{background:#64748b;color:#fff}.btn-dark{background:#166534;color:#fff}
input,select,textarea{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px;margin:5px 0 10px;background:#fff}
.hidden{display:none!important}.wrap{max-width:1100px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:14px;border-radius:14px;margin-bottom:12px}
.top h2{margin:0;color:#15803d}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:8px}.tabs button{background:#dcfce7;color:#166534;white-space:nowrap}.tabs button.active{background:#16a34a;color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.card{background:#fff;padding:16px;border-radius:13px;box-shadow:0 2px 9px #0000000b}.num{font-size:25px;font-weight:800;color:#15803d}
.panel{background:#fff;padding:15px;border-radius:13px;margin-top:12px}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}.item{border:1px solid #e5e7eb;padding:12px;border-radius:10px;margin:8px 0}.actions{display:flex;gap:7px;flex-wrap:wrap}.small{font-size:12px;color:#64748b}.ok{color:#15803d;font-weight:700}.bad{color:#dc2626;font-weight:700}
table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left;font-size:13px}th{background:#f0fdf4}
.login{max-width:420px;margin:10vh auto;background:#fff;padding:25px;border-radius:16px;box-shadow:0 3px 18px #0001}.login h1{color:#15803d}
@media(max-width:600px){.wrap{padding:10px}.top{align-items:flex-start}.cards{grid-template-columns:1fr 1fr}}
</style></head><body>
<div id="login" class="login"><h1>🎮 Ludo Master Admin</h1><p>Admin Login</p>
<input id="am" placeholder="Admin Mobile"><input id="ap" type="password" placeholder="Admin Password">
<button class="primary" style="width:100%" onclick="login()">Login</button><p id="lm" class="bad"></p></div>

<div id="app" class="wrap hidden">
<div class="top"><h2>🎮 Ludo Master Admin v2</h2><div class="actions"><button class="btn" onclick="loadAll()">↻ Refresh</button><button class="btn-gray" onclick="logout()">Logout</button></div></div>
<div class="tabs">
<button class="active" onclick="tab('dash',this)">Dashboard</button><button onclick="tab('users',this)">Users</button><button onclick="tab('money',this)">Deposit/Withdraw</button><button onclick="tab('matches',this)">Matches</button><button onclick="tab('wins',this)">Winning</button><button onclick="tab('support',this)">Support</button><button onclick="tab('ann',this)">Announcement</button>
</div>

<section id="dash" class="panel"><h3>Dashboard</h3><div id="cards" class="cards"></div></section>
<section id="users" class="panel hidden"><h3>Users</h3><input id="uq" placeholder="Search name/mobile" oninput="loadUsers()"><div id="usersList"></div></section>
<section id="money" class="panel hidden"><h3>Deposit / Withdraw</h3><div id="moneyList"></div></section>
<section id="matches" class="panel hidden"><h3>Create Match</h3>
<div class="row"><input id="mt" placeholder="Title"><input id="me" type="number" placeholder="Entry Fee"><input id="mp" type="number" placeholder="Prize"><input id="mx" type="number" value="4" placeholder="Max Players"><input id="mti" placeholder="Time"><input id="mr" placeholder="Room ID"><select id="ms"><option value="upcoming">upcoming</option><option value="live">live</option><option value="completed">completed</option></select></div>
<button class="btn" onclick="createMatch()">+ Create Match</button><div id="matchList"></div></section>
<section id="wins" class="panel hidden"><h3>Winning Requests</h3><div id="winList"></div></section>
<section id="support" class="panel hidden"><h3>Support</h3><div id="supportList"></div></section>
<section id="ann" class="panel hidden"><h3>Announcement</h3><input id="at" placeholder="Title"><textarea id="amessage" rows="3" placeholder="Announcement message"></textarea><button class="btn" onclick="createAnn()">Publish</button><div id="annList"></div></section>
</div>
<script>
const API="";
let token=localStorage.getItem("adminToken");
function headers(json=true){const h={Authorization:"Bearer "+token};if(json)h["Content-Type"]="application/json";return h}
async function api(url,opt={}){opt.headers={...(opt.headers||{}),...headers(opt.body instanceof FormData?false:true)};const r=await fetch(API+url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||"Request failed");return d}
async function login(){try{const d=await api("/api/admin/login",{method:"POST",body:JSON.stringify({mobile:am.value.trim(),password:ap.value})});token=d.token;localStorage.setItem("adminToken",token);show();loadAll()}catch(e){lm.textContent=e.message}}
function show(){loginBox=false;document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden")}
function logout(){localStorage.removeItem("adminToken");location.reload()}
if(token)show();
function tab(id,b){document.querySelectorAll("#app section").forEach(x=>x.classList.add("hidden"));document.getElementById(id).classList.remove("hidden");document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));b.classList.add("active");if(id==="users")loadUsers();if(id==="money")loadMoney();if(id==="matches")loadMatches();if(id==="wins")loadWins();if(id==="support")loadSupport();if(id==="ann")loadAnn()}
async function loadAll(){try{const d=await api("/api/admin/dashboard");cards.innerHTML=[["Users",d.users],["Matches",d.matches],["Gaming Balance","৳"+d.gaming_balance],["Winning Balance","৳"+d.winning_balance],["Pending",""+d.pending_requests],["Deposit Pending",d.deposit_pending],["Withdraw Pending",d.withdraw_pending],["Winning Pending",d.winning_pending]].map(x=>`<div class="card"><div>${x[0]}</div><div class="num">${x[1]}</div></div>`).join("")}catch(e){alert(e.message)}}
async function loadUsers(){const d=await api("/api/admin/users?q="+encodeURIComponent(uq.value));usersList.innerHTML=d.map(u=>`<div class="item"><b>#${u.id} ${esc(u.name)}</b> <span class="${u.blocked?"bad":"ok"}">${u.blocked?"BLOCKED":"ACTIVE"}</span><div class="small">${esc(u.mobile)} • Gaming ৳${u.balance.gaming_balance} • Winning ৳${u.balance.winning_balance}</div><div class="actions"><button class="btn" onclick="adjust(${u.id},'gaming')">Gaming ±</button><button class="btn" onclick="adjust(${u.id},'winning')">Winning ±</button><button class="${u.blocked?"btn":"btn-danger"}" onclick="blockUser(${u.id})">${u.blocked?"Unblock":"Block"}</button></div></div>`).join("")||"<p>No users</p>"}
async function blockUser(id){try{await api("/api/admin/users/"+id+"/block",{method:"POST"});loadUsers();loadAll()}catch(e){alert(e.message)}}
async function adjust(id,type){const a=prompt("Amount লিখুন (কমাতে minus, যেমন -50):");if(a===null)return;try{await api("/api/admin/users/"+id+"/balance",{method:"POST",body:JSON.stringify({type,amount:Number(a)})});loadUsers();loadAll()}catch(e){alert(e.message)}}
async function loadMoney(){const d=await api("/api/admin/transactions");moneyList.innerHTML=d.filter(x=>["deposit","withdraw"].includes(x.type)).map(t=>`<div class="item"><b>#${t.id} ${t.type.toUpperCase()}</b> — ৳${t.amount} — <span>${t.status}</span><div>${esc(t.user)} (${esc(t.mobile)})</div><div class="small">${t.method||""} ${t.transaction_id||t.number||""}</div>${t.status==="pending"?`<div class="actions"><button class="btn" onclick="moneyAction(${t.id},'approve')">Approve</button><button class="btn-danger" onclick="moneyAction(${t.id},'reject')">Reject</button></div>`:""}</div>`).join("")||"<p>No transactions</p>"}
async function moneyAction(id,action){try{await api("/api/admin/transactions/"+id+"/action",{method:"POST",body:JSON.stringify({action})});loadMoney();loadAll()}catch(e){alert(e.message)}}
async function createMatch(){const body={title:mt.value,entry_fee:Number(me.value),prize:Number(mp.value),max_players:Number(mx.value),time:mti.value,room_id:mr.value,status:ms.value};try{await api("/api/admin/matches",{method:"POST",body:JSON.stringify(body)});["mt","me","mp","mti","mr"].forEach(id=>document.getElementById(id).value="");loadMatches();loadAll()}catch(e){alert(e.message)}}
async function loadMatches(){const d=await api("/api/admin/matches");matchList.innerHTML=d.map(m=>`<div class="item"><b>#${m.id} ${esc(m.title)}</b> — ${m.status}<div>Entry ৳${m.entry_fee} • Prize ৳${m.prize} • ${m.players}/${m.max_players} • ${esc(m.time||"")} • Room: ${esc(m.room_id||"-")}</div><div class="actions"><button class="btn" onclick="editMatch(${m.id})">Edit</button><button class="btn-danger" onclick="delMatch(${m.id})">Delete</button></div></div>`).join("")||"<p>No matches</p>"}
async function editMatch(id){const title=prompt("Title:");if(title===null)return;const status=prompt("Status: upcoming / live / completed","upcoming");const room=prompt("Room ID:","");try{await api("/api/admin/matches/"+id,{method:"PUT",body:JSON.stringify({title,status,room_id:room})});loadMatches()}catch(e){alert(e.message)}}
async function delMatch(id){if(!confirm("Delete match?"))return;try{await api("/api/admin/matches/"+id,{method:"DELETE"});loadMatches();loadAll()}catch(e){alert(e.message)}}
async function loadWins(){const d=await api("/api/admin/winnings");winList.innerHTML=d.map(w=>`<div class="item"><b>#${w.id} ${esc(w.user)}</b> — ${w.status}<div>Match ${w.match_id} • Room ${esc(w.room_id)} • ${esc(w.mobile)}</div>${w.screenshot_url?`<a href="${w.screenshot_url}" target="_blank">View Screenshot</a>`:""}${w.status==="pending"?`<div class="actions"><button class="btn" onclick="winAction(${w.id},'approve')">Approve Prize</button><button class="btn-danger" onclick="winAction(${w.id},'reject')">Reject</button></div>`:""}</div>`).join("")||"<p>No winning requests</p>"}
async function winAction(id,action){try{await api("/api/admin/winnings/"+id+"/action",{method:"POST",body:JSON.stringify({action})});loadWins();loadAll()}catch(e){alert(e.message)}}
async function loadSupport(){const d=await api("/api/admin/support");supportList.innerHTML=d.map(s=>`<div class="item"><b>#${s.id} ${esc(s.user)}</b> — ${s.status}<div>${esc(s.message)}</div><div class="small">${esc(s.mobile)}</div><textarea id="reply${s.id}" rows="2" placeholder="Reply">${esc(s.reply||"")}</textarea><button class="btn" onclick="reply(${s.id})">Send Reply</button></div>`).join("")||"<p>No messages</p>"}
async function reply(id){try{await api("/api/admin/support/"+id+"/reply",{method:"POST",body:JSON.stringify({reply:document.getElementById("reply"+id).value})});loadSupport()}catch(e){alert(e.message)}}
async function createAnn(){try{await api("/api/admin/announcements",{method:"POST",body:JSON.stringify({title:at.value,message:amessage.value})});at.value="";amessage.value="";loadAnn()}catch(e){alert(e.message)}}
async function loadAnn(){const d=await api("/api/admin/announcements");annList.innerHTML=d.map(a=>`<div class="item"><b>${esc(a.title)}</b> — ${a.active?"ACTIVE":"OFF"}<div>${esc(a.message)}</div><div class="actions"><button class="btn" onclick="toggleAnn(${a.id},${!a.active})">${a.active?"Disable":"Enable"}</button><button class="btn-danger" onclick="delAnn(${a.id})">Delete</button></div></div>`).join("")||"<p>No announcements</p>"}
async function toggleAnn(id,active){await api("/api/admin/announcements/"+id,{method:"PUT",body:JSON.stringify({active})});loadAnn()}
async function delAnn(id){if(confirm("Delete announcement?")){await api("/api/admin/announcements/"+id,{method:"DELETE"});loadAnn()}}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
if(token)loadAll();
</script></body></html>
